[project]
name = "medicine-project"
version = "0.1.0"
description = "Medicine Object Detection Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "torchmetrics>=1.9",
    "gdown>=6.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0",
    "ultralytics>=8.0",
    "transformers>=4.0",
    "timm>=0.9",
    "requests>=2.0",
    "python-dotenv>=1.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
